<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Nexus Fest 2026 - Claim Attendance</title>
  <meta name="description" content="Scan to claim your free attendance. Totally legit. No cap.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b2a2e;
      --bg2: #103b40;
      --wood: #8a5a2b;
      --wood-d: #5e3a17;
      --wood-l: #b07a41;
      --grass: #5fc74a;
      --grass-d: #2f7d28;
      --gold: #ffd84a;
      --ink: #fff6df;
      --me: #2b6f77;
      --them: #f1e3c3;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b2a2e
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b2a2e
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'VT323', 'Courier New', monospace;
      font-size: 22px;
      line-height: 1.25;
      background-image: linear-gradient(var(--bg2) 2px, transparent 2px), linear-gradient(90deg, var(--bg2) 2px, transparent 2px);
      background-size: 32px 32px;
      -webkit-tap-highlight-color: transparent
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 18px 16px 40px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    h1,
    .px {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-weight: 400
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--gold)
    }

    .badge {
      background: var(--wood-d);
      border: 3px solid #000;
      padding: 6px 8px;
      box-shadow: 3px 3px 0 #000
    }

    .sign {
      background: var(--wood);
      border: 4px solid #000;
      box-shadow: inset 0 0 0 4px var(--wood-l), 6px 6px 0 #000;
      padding: 22px 16px;
      text-align: center
    }

    .sign h1 {
      font-size: 18px;
      line-height: 1.5;
      margin: 0 0 12px;
      text-shadow: 3px 3px 0 #000
    }

    .sign p {
      margin: 0;
      font-size: 24px
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #10300c;
      background: var(--grass);
      border: 4px solid #000;
      box-shadow: inset 0 -6px 0 var(--grass-d), inset 0 4px 0 #9be885, 5px 5px 0 #000;
      padding: 16px 14px;
      width: 100%;
      cursor: pointer;
      transition: transform 0.1s ease
    }

    .btn:active {
      transform: translate(4px, 4px);
      box-shadow: inset 0 -6px 0 var(--grass-d), inset 0 4px 0 #9be885, 1px 1px 0 #000
    }

    .btn:focus-visible,
    .replay:focus-visible {
      outline: 4px solid var(--gold);
      outline-offset: 3px
    }

    .btn.pulse {
      animation: pulse 1.1s steps(2) infinite
    }

    @keyframes pulse {
      50% {
        background: #7ee066;
        transform: scale(1.03)
      }
    }

    .btn.gold {
      background: var(--gold);
      box-shadow: inset 0 -6px 0 #c9a21f, inset 0 4px 0 #fff0a0, 5px 5px 0 #000;
      animation: goldPulse 1.4s ease-in-out infinite
    }

    @keyframes goldPulse {

      0%,
      100% {
        box-shadow: inset 0 -6px 0 #c9a21f, inset 0 4px 0 #fff0a0, 5px 5px 0 #000, 0 0 15px rgba(255, 216, 74, 0.3)
      }

      50% {
        box-shadow: inset 0 -6px 0 #c9a21f, inset 0 4px 0 #fff0a0, 5px 5px 0 #000, 0 0 35px rgba(255, 216, 74, 0.6), 0 0 60px rgba(255, 216, 74, 0.2)
      }
    }

    .hint {
      text-align: center;
      font-size: 20px;
      color: #9cc9c4
    }

    .scene {
      display: none;
      flex-direction: column;
      gap: 14px;
      flex: 1
    }

    .scene.on {
      display: flex
    }

    /* ── Meme media container (no box — transparent GIF floats freely) ── */
    .meme-float {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center
    }

    .meme-float img {
      width: 100%;
      max-width: 320px;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.5))
    }

    .meme-float .ph {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      line-height: 1.8;
      color: #9cc9c4;
      padding: 20px;
      text-align: center
    }

    /* Scene 1 placeholder (keeps the framed style) */
    .video-placeholder {
      position: relative;
      aspect-ratio: 9/12;
      max-height: 42vh;
      width: 100%;
      background: #000;
      border: 4px solid #000;
      box-shadow: inset 0 0 0 4px var(--wood-l), 6px 6px 0 #000;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden
    }

    .video-placeholder .ph {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      line-height: 1.8;
      color: #9cc9c4;
      padding: 20px
    }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .msg {
      max-width: 88%;
      padding: 10px 12px;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      color: #1b1206;
      background: var(--them);
      animation: pop .18s steps(3) both;
      font-size: 23px
    }

    .msg.big {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      line-height: 1.6;
      background: var(--gold);
      padding: 12px
    }

    .msg.me {
      align-self: flex-end;
      background: var(--me);
      color: var(--ink)
    }

    .msg b {
      color: #a31d1d
    }

    @keyframes pop {
      from {
        transform: scale(.85) translateY(8px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .typing {
      align-self: flex-start;
      display: flex;
      gap: 6px;
      padding: 12px 14px;
      background: var(--them);
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000
    }

    .typing i {
      width: 9px;
      height: 9px;
      background: #5e3a17;
      display: block;
      animation: blink 1s steps(2) infinite
    }

    .typing i:nth-child(2) {
      animation-delay: .2s
    }

    .typing i:nth-child(3) {
      animation-delay: .4s
    }

    @keyframes blink {
      50% {
        opacity: .2
      }
    }

    .cta {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px
    }

    .cta.on {
      display: flex;
      animation: pop .2s steps(3) both
    }

    .foot {
      text-align: center;
      font-size: 20px;
      color: #9cc9c4
    }

    .foot span {
      font-size: 16px;
      display: block;
      margin-top: 4px
    }

    .replay {
      align-self: center;
      background: none;
      border: 2px dashed #3f7a80;
      color: #9cc9c4;
      font-family: 'VT323', monospace;
      font-size: 20px;
      padding: 6px 12px;
      cursor: pointer;
      margin-top: 6px
    }

    @media (prefers-reduced-motion: reduce) {

      .btn.pulse,
      .btn.gold,
      .typing i,
      .video .rec {
        animation: none
      }

      .msg,
      .cta.on {
        animation: none
      }
    }

    /* ═══════════════════════════════════════════════════
   FLOATING PARTICLES
   ═══════════════════════════════════════════════════ */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden
    }

    .particle {
      position: absolute;
      opacity: 0;
      animation: floatUp linear infinite;
      will-change: transform, opacity;
      font-size: 14px
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(100vh) rotate(0deg) scale(.6)
      }

      10% {
        opacity: .5
      }

      90% {
        opacity: .5
      }

      100% {
        opacity: 0;
        transform: translateY(-10vh) rotate(360deg) scale(1)
      }
    }

    /* ═══════════════════════════════════════════════════
   DESKTOP LAYOUT (>= 768px)
   Side-by-side: meme left, chat/CTA right
   ═══════════════════════════════════════════════════ */
    @media (min-width:768px) {
      .wrap {
        max-width: 920px;
        padding: 32px 28px 48px
      }

      /* Scene 1 centers nicely on desktop */
      #s1 {
        max-width: 520px;
        margin: 0 auto;
        align-items: center
      }

      #s1 .sign {
        max-width: 480px;
        width: 100%
      }

      #s1 .btn {
        max-width: 480px
      }

      /* Scene 2 uses side-by-side grid */
      #s2 {
        display: none;
        flex-direction: column;
        gap: 20px
      }

      #s2.on {
        display: flex
      }

      .s2-topbar {
        order: -1
      }

      .s2-grid {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 28px;
        align-items: start;
        flex: 1
      }

      .s2-left {
        position: sticky;
        top: 32px
      }

      .s2-right {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0
      }

      .meme-float img {
        max-width: 100%
      }

      .msg {
        font-size: 24px
      }

      .msg.big {
        font-size: 14px
      }

      .btn {
        font-size: 14px;
        padding: 18px 16px
      }

      .foot {
        font-size: 22px
      }

      .replay {
        font-size: 22px
      }
    }

    @media (min-width:1024px) {
      .wrap {
        max-width: 1060px
      }

      .s2-grid {
        grid-template-columns: 380px 1fr;
        gap: 36px
      }
    }

    /* ═══════════════════════════════════════════════════
   TINY SCREENS (<=360px)
   ═══════════════════════════════════════════════════ */
    @media (max-width:360px) {
      .wrap {
        padding: 12px 10px 32px
      }

      .sign h1 {
        font-size: 14px
      }

      .sign p {
        font-size: 20px
      }

      .btn {
        font-size: 10px;
        padding: 12px 10px
      }

      .msg {
        font-size: 20px
      }

      .msg.big {
        font-size: 11px
      }

      .topbar {
        font-size: 8px
      }

      .badge {
        padding: 4px 6px
      }
    }
  </style>
</head>

<body>

  <!-- Floating pixel particles -->
  <div class="particles" id="particles"></div>

  <div class="wrap">

    <!-- SCENE 1: landing -->
    <section class="scene on" id="s1">
      <div class="sign">
        <h1>Attendance QR<br>Scanned!</h1>
        <p>Your free attendance is ready to claim.</p>
      </div>
      <button class="btn pulse" id="go">TAP TO CLAIM ATTENDANCE</button>
      <div class="hint">One tap. No forms. Totally legit.</div>
    </section>

    <!-- SCENE 2: meme + messages -->
    <section class="scene" id="s2">
      <div class="topbar s2-topbar"><span class="badge">NEXUS FEST 2026</span><span id="status">Loading...</span></div>

      <!-- Desktop grid wrapper -->
      <div class="s2-grid">
        <!-- Left: meme (no box, transparent GIF floats) -->
        <div class="s2-left">
          <div class="meme-float" id="meme-box">
            <img id="meme-gif" src="./cat_transparent.gif" alt="Meme" loading="eager">
            <div class="ph" id="meme-fallback" style="display:none">&#128128; MEME.EXE<br>HAS STOPPED<br>WORKING
              &#128128;</div>
          </div>
        </div>

        <!-- Right: chat + CTA -->
        <div class="s2-right">
          <div class="chat" id="chat" aria-live="polite"></div>
          <div class="cta" id="cta">
            <button class="btn gold pulse" id="reg">REGISTER FOR STARTUP PITCH</button>
            <div class="foot"><span></span></div>
          </div>
        </div>
      </div>

    </section>

  </div>

  <!-- Audio (meme sound, unlocked by user tap) -->
  <audio id="meme-audio" preload="auto" loop>
    <source src="./ReelAudio-46990.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* ═══════════════════════════════════════════════════
       ANALYTICS HOOKS
       Replace console.log with your real analytics calls.
       e.g., fetch('/api/track', { method:'POST', body: JSON.stringify({event:'scan'}) })
       ═══════════════════════════════════════════════════ */
    var Analytics = {
      trackScan: function () {
        console.log('[NexusFest Analytics] Page scanned / opened');
        // TODO: plug in analytics
      },
      trackReveal: function () {
        console.log('[NexusFest Analytics] Meme revealed (tap claimed)');
        // TODO: plug in analytics
      },
      trackButtonClick: function () {
        console.log('[NexusFest Analytics] CTA button clicked — redirecting');
        // TODO: plug in analytics
      }
    };

    // Track scan on load
    Analytics.trackScan();

    /* ═══════════════════════════════════════════════════
       FLOATING PARTICLES
       ═══════════════════════════════════════════════════ */
    (function spawnParticles() {
      var container = document.getElementById('particles');
      var emojis = ['\u{1F48E}', '\u2728', '\u2B50', '\u{1F7E9}', '\u{1F7EB}', '\u{1F49A}', '\u{1F9F1}', '\u26CF\uFE0F'];
      var count = window.innerWidth < 500 ? 8 : 14;
      for (var i = 0; i < count; i++) {
        var el = document.createElement('span');
        el.className = 'particle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = (12 + Math.random() * 12) + 'px';
        el.style.animationDuration = (10 + Math.random() * 16) + 's';
        el.style.animationDelay = (Math.random() * 14) + 's';
        container.appendChild(el);
      }
    })();

    /* ═══════════════════════════════════════════════════
       ELEMENTS
       ═══════════════════════════════════════════════════ */
    var go = document.getElementById('go');
    var s1 = document.getElementById('s1');
    var s2 = document.getElementById('s2');
    var chat = document.getElementById('chat');
    var cta = document.getElementById('cta');
    var status = document.getElementById('status');
    var memeGif = document.getElementById('meme-gif');
    var memeFallback = document.getElementById('meme-fallback');
    var memeAudio = document.getElementById('meme-audio');
    var timers = [];

    /* ── Meme fallback ── */
    memeGif.addEventListener('error', function () {
      memeGif.style.display = 'none';
      memeFallback.style.display = 'block';
    });

    /* ═══════════════════════════════════════════════════
       MESSAGE SCRIPT
       [text, className, delay before appearing (ms)]
       ═══════════════════════════════════════════════════ */
    var script = [
      ["BRO. YOU REALLY THOUGHT. \u{1F480}", "big", 2200],
      ["No free attendance. You just got scanned into Nexus Fest. \u{1F480}", "", 1700],
      ["Hackathon registrations are closed, but startup pitch registrations are still open.", "", 2000],
      ["Your attendance is at 62%. Your startup idea has been in your Notes app forever.", "", 1900],
      ["Registering costs ₹0. Staying a 'someday founder' costs way more. \u{1F608}", "", 1800],
      ["Okay fine, I'm pitching. Registering now. \u{1F62D}", "me", 1600]
    ]

    function clearAll() {
      timers.forEach(clearTimeout);
      timers = [];
      chat.innerHTML = '';
      cta.classList.remove('on');
    }

    function run() {
      clearAll();
      status.textContent = 'Playing...';

      /* Play audio (user gesture unlocks this) */
      memeAudio.currentTime = 0;
      memeAudio.play().catch(function (e) {
        console.warn('[NexusFest] Audio play blocked:', e);
      });

      var t = 0;
      script.forEach(function (m) {
        t += m[2];
        /* typing indicator ~700ms before each message */
        timers.push(setTimeout(function () {
          var ty = document.createElement('div');
          ty.className = 'typing';
          ty.id = 'ty';
          ty.innerHTML = '<i></i><i></i><i></i>';
          chat.appendChild(ty);
          ty.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }, t - 700));
        timers.push(setTimeout(function () {
          var ty = document.getElementById('ty');
          if (ty) ty.remove();
          var d = document.createElement('div');
          d.className = 'msg ' + m[1];
          d.textContent = m[0];
          chat.appendChild(d);
          d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }, t));
      });
      timers.push(setTimeout(function () {
        cta.classList.add('on');
        status.textContent = 'Almost there';
        /* Scroll CTA into view */
        document.getElementById('reg').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }, t + 900));
    }

    /* ═══════════════════════════════════════════════════
       EVENT HANDLERS
       ═══════════════════════════════════════════════════ */
    go.addEventListener('click', function () {
      Analytics.trackReveal();
      s1.classList.remove('on');
      s2.classList.add('on');
      run();
    });

    var replayBtn = document.getElementById('replay');
    if (replayBtn) {
      replayBtn.addEventListener('click', function () {
        memeAudio.pause();
        memeAudio.currentTime = 0;
        /* Re-load the GIF so it restarts from frame 1 */
        var src = memeGif.src;
        memeGif.src = '';
        memeGif.src = src;
        s2.classList.remove('on');
        s1.classList.add('on');
        clearAll();
      });
    }

    // TODO: Replace with the actual startup pitch registration URL
    var NEXUS_FEST_URL = 'https://fest.nexusclubs.in';
    document.getElementById('reg').addEventListener('click', function () {
      Analytics.trackButtonClick();
      window.location.href = NEXUS_FEST_URL;
    });
  </script>
</body>

</html>
